# Birdsong on the internet, through a Cloudflare Tunnel, signed in with Cloudflare Access.
# Step-by-step guide: docs/cloudflare-tunnel.md
#
#   cp .env.example .env && chmod 600 .env     # then fill in .env
#   docker compose -f docker-compose.tunnel.yml up -d --build
#
# Nothing on your router changes: no ports are forwarded. cloudflared makes an outgoing
# connection to Cloudflare and hands visitors to Birdsong's internet door (port 8081) over a
# private Docker network that has no route anywhere else.

name: birdsong

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  birdsong:
    # Built from this checkout, so what runs is exactly what is in front of you.
    build: .
    image: birdsong:local
    container_name: birdsong
    restart: unless-stopped
    environment:
      BIRDNET_URL: ${BIRDNET_URL:?Set BIRDNET_URL in .env, e.g. http://192.168.1.50:8080}
      REQUIRE_CLOUDFLARE_ACCESS: ${REQUIRE_CLOUDFLARE_ACCESS:-true}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    ports:
      # The LAN door, http://<this server>:8095, as before. LAN_BIND=127.0.0.1 in .env
      # keeps it to this server only. The internet door (8081) is never published.
      - "${LAN_BIND:-0.0.0.0}:${LAN_PORT:-8095}:80"
    networks: [tunnel, lan]
    # Hardening: nothing in the container can be changed, no privileges beyond what nginx
    # needs to start, and limits on what a misbehaving process could use.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=16m
      - /run:size=1m
      - /tmp:size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    cpus: 1.0
    logging: *logging

  cloudflared:
    # Pinned: update the tag deliberately (see "Keeping it up to date" in the guide).
    image: cloudflare/cloudflared:2026.11.0
    container_name: birdsong-cloudflared
    restart: unless-stopped
    # Metrics stay inside the container; --no-autoupdate because Docker updates it instead.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Put your Cloudflare tunnel token in .env (see docs/cloudflare-tunnel.md)}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      birdsong:
        condition: service_healthy
    networks: [tunnel, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    logging: *logging

networks:
  # cloudflared <-> Birdsong only. "internal": no way out to your LAN or the internet.
  tunnel:
    internal: true
    driver_opts: { com.docker.network.bridge.name: bs-tunnel }
  # Birdsong's way to BirdNET-Go. (The page fetches Wikipedia pictures itself, in the browser.)
  lan:
    driver_opts: { com.docker.network.bridge.name: bs-lan }
  # cloudflared's way out to Cloudflare.
  egress:
    driver_opts: { com.docker.network.bridge.name: bs-egress }
