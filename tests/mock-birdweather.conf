# nginx.conf for the BirdWeather stand-in used by tests/smoke-test.sh (see mock-birdweather.js).
load_module modules/ngx_http_js_module.so;
events {}
http {
    js_import mock from /etc/nginx/mock-birdweather.js;
    server {
        listen 8090;
        location = /graphql {
            client_body_buffer_size 16k;
            client_max_body_size 16k;
            js_content mock.graphql;
        }
        location / { return 404 "not BirdWeather's API\n"; }
    }
}
