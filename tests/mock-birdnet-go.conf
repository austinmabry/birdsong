# Stand-in for BirdNET-Go: echoes what reached it, and misbehaves on purpose.
server {
    listen 8080;
    default_type application/json;
    add_header Set-Cookie "session=secret" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Powered-By "BirdNET-Go-mock" always;
    add_header Cache-Control "public, max-age=99999" always;

    location = /api/v2/analytics/species/summary {
        return 200 '[{"scientific_name":"Erithacus rubecula","common_name":"European Robin","count":42},{"scientific_name":"Turdus merula","common_name":"Eurasian Blackbird","count":17}]';
    }
    location = /api/v2/fail {
        return 500 '{"error":"stack trace at /home/secret/path.go:42"}';
    }
    location = /api/v2/species {
        if ($arg_scientific_name = "Boom") { return 500 '{"error":"internal detail /home/secret"}'; }
        return 200 '{"echo":true,"method":"$request_method","uri":"$request_uri","host":"$http_host","cookie":"$http_cookie","authorization":"$http_authorization","xff":"$http_x_forwarded_for","xrealip":"$http_x_real_ip","cfip":"$http_cf_connecting_ip","jwt":"$http_cf_access_jwt_assertion","ua":"$http_user_agent","range":"$http_range","accept":"$http_accept"}';
    }
    location / {
        return 200 '{"echo":true,"method":"$request_method","uri":"$request_uri","cookie":"$http_cookie","xff":"$http_x_forwarded_for","jwt":"$http_cf_access_jwt_assertion","range":"$http_range"}';
    }
}
