# The page itself, shared by both doors (server context).

# Only GET and HEAD: Birdsong never changes anything.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Short, plain error replies: no server name or version, and nothing passed on from
# BirdNET-Go's own error messages. The status code is kept. A named location skips the
# checks above on the way to the reply; requests too malformed to have a path (400) need
# a plain one instead.
error_page 401 403 404 405 413 414 429 500 502 503 504 @bs_error;
error_page 400 /bs-error;
location @bs_error       { default_type text/plain; return 200 "Not available.\n"; }
location = /bs-error     { internal; default_type text/plain; return 200 "Not available.\n"; }

# What there is to serve, and nothing else.
location = /            { }
location = /index.html  { }
location = /app.js      { }
location = /app.css     { }
location /fonts/        { }
location /art/          { }   # the Fugleramme artwork, its manifest and ATTRIBUTION.md
location = /robots.txt  { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
location ~ /\.          { return 404; }
location /              { return 404; }
