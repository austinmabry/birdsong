# The page itself, shared by both doors (server context).

# Only GET and HEAD: Birdsong never changes anything.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
# No encoded slashes or dots, doubled slashes or dot segments (see $bs_odd_path).
if ($bs_odd_path) { return 400; }

# Serve real files only, never through a symbolic link.
disable_symlinks on;

# Short, plain error replies: no server name or version, and nothing passed on from
# BirdNET-Go's own error messages. The status code is kept. A named location skips the
# checks above on the way to the reply; requests too malformed to have a path (400) need
# a plain one instead.
error_page 401 403 404 405 413 416 429 500 501 502 503 504 @bs_error;
error_page 400 414 494 505 /bs-error;
location @bs_error       { default_type text/plain; return 200 "Not available.\n"; }
location = /bs-error     { internal; default_type text/plain; return 200 "Not available.\n"; }

# What there is to serve, and nothing else.
location = /            { }
location = /index.html  { }
location = /app.js      { }
location = /app.css     { }
location /fonts/        { }
# The Fugleramme artwork: only its own kinds of file, whatever else the project ever adds,
# so nothing in it can be served as a web page or script from Birdsong's address.
location /art/ {
    location ~ "\.(webp|png|json)$"              { }
    location ~ "/ATTRIBUTION\.md$"               { default_type text/plain; }
    location = /art/FUGLERAMME_COMMIT            { default_type text/plain; }
    return 404;
}
location = /robots.txt  { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
location ~ /\.          { return 404; }
location /              { return 404; }
