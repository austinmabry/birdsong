# How Birdsong talks to BirdNET-Go. Included by each allowed /api/ location.

# Plain paths only (see $bs_plain_api_path in default.conf).
if ($bs_plain_api_path = 0) { return 404; }

# Internet door only (the LAN door has no limit key): 5 a second, bursts of 40.
limit_req zone=bs_api burst=40 nodelay;

# Send BirdNET-Go only what these calls need. No cookies, no Cloudflare sign-in token, and
# no forwarded addresses: BirdNET-Go sees every request as coming from this container.
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host $proxy_host;
proxy_set_header Connection "";
proxy_set_header Content-Length "";
proxy_set_header User-Agent "Birdsong";
proxy_set_header Accept $http_accept;
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header If-Modified-Since $http_if_modified_since;

proxy_connect_timeout 5s;
proxy_send_timeout 10s;
proxy_read_timeout 60s;
proxy_max_temp_file_size 0;   # stream large recordings instead of writing them to disk

# Nothing from BirdNET-Go may set cookies, open the data to other websites, or replace
# Birdsong's own security and caching headers.
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header X-Powered-By;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;

# BirdNET-Go's errors are replaced by the plain reply in site.conf, keeping the status code.
proxy_intercept_errors on;
