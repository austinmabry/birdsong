# Security headers for the internet door (Cloudflare Tunnel). Scripts and styles come only
# from Birdsong itself; data and pictures only from Birdsong, Wikipedia and Wikimedia Commons,
# and BirdWeather's pictures and recordings when the plate comes from a BirdWeather station.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://media.birdweather.com; media-src 'self' https://media.birdweather.com; connect-src 'self' https://commons.wikimedia.org https://en.wikipedia.org; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control $bs_cache_control always;
